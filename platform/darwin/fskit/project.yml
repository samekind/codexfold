name: CodexFoldFSKit
options:
  bundleIdPrefix: vip.jstar.codexfold
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    DEVELOPMENT_TEAM: Y987FUR837
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "114"
targets:
  CodexFoldFSKit:
    type: application
    platform: macOS
    sources:
      - path: Host
        excludes:
          - Tests
          - IncidentMonitorMain.swift
          - CodexFoldIncidentMonitor.plist
          - CodexFoldMenuBar.plist
      - path: Host/CodexFoldIncidentMonitor.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      - path: Host/CodexFoldMenuBar.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      - path: Shared/DurableAppGroupFile.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vip.jstar.codexfold.fskitprofileprobe
        INFOPLIST_FILE: Host/Info.plist
        CODE_SIGN_ENTITLEMENTS: CodexFoldFSKit.entitlements
        REGISTER_APP_GROUPS: YES
    dependencies:
      - target: CodexFoldFSKitModule
        embed: true
      - target: CodexFoldIncidentMonitor
        embed: true
        copy:
          destination: executables
  CodexFoldIncidentMonitor:
    type: tool
    platform: macOS
    sources:
      - path: Host/IncidentMonitorMain.swift
      - path: Host/IncidentPresentation.swift
      - path: Host/StatusModel.swift
      - path: Host/Localization.swift
      - path: Host/StatusViews.swift
      - path: Host/EnrollmentControl.swift
      - path: Shared/DurableAppGroupFile.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vip.jstar.codexfold.fskitprofileprobe.incident-monitor
        CODE_SIGN_ENTITLEMENTS: CodexFoldFSKit.entitlements
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES
  CodexFoldFSKitHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Host/Tests
      - path: Shared/ReadAheadDecision.swift
      - path: Host/StatusModel.swift
      - path: Host/Localization.swift
      - path: Host/StatusViews.swift
      - path: Host/EnrollmentControl.swift
      - path: Host/IncidentPresentation.swift
      - path: Host/ResidencyConfiguration.swift
      - path: Shared/DurableAppGroupFile.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vip.jstar.codexfold.fskitprofileprobe.hosttests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: XCTest.framework
  CodexFoldFSKitModule:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: Extension
      - path: Shared/DurableAppGroupFile.swift
      - path: Shared/ReadAheadDecision.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vip.jstar.codexfold.fskitprofileprobe.module
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/CodexFoldFSKitModule.entitlements
        REGISTER_APP_GROUPS: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
      configs:
        Release:
          # FSKit rejects development-only debug entitlement get-task-allow.
          # Keep Debug attachable, but ship a Release module without it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
