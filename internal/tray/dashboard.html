  $('identity').classList.toggle('healthy', view.Healthy);
  $('identity').classList.toggle('attention', view.Health === '需要关注');
  $('status-symbol').setAttribute('href', view.Healthy ? '#i-status-healthy' : view.Health === '需要关注' ? '#i-status-attention' : '#i-status-unknown');
  $('details').textContent = view.Detail;
  $('diagnostic-details').textContent = view.Detail;
  $('store-path').textContent = view.StorePath || '';
  $('session-count').textContent = view.Sessions;
  $('daemon-state').textContent = view.DaemonState || '未连接';
  $('managed-state').textContent = view.ManagedState || '未连接';
  $('fold-status').textContent = view.EnrollmentState || '未连接';
  updateSettings(view.Settings || {});updateProgress(view);
  if (view.Operation && view.Operation.ID !== lastOperation) { lastOperation=view.Operation.ID;window.showOperationResult(view.Operation); }
  $('logical').textContent = bytes(view.LogicalBytes);
  $('physical').textContent = bytes(view.PhysicalBytes);
  const compressedKnown = view.CompressionLogicalBytes != null && view.CompressedBytes != null;
  const saved = compressedKnown ? Math.max(0, view.CompressionLogicalBytes - view.CompressedBytes) : null;
  $('saved').textContent = bytes(saved);
  $('saving').textContent = compressedKnown && view.CompressionLogicalBytes > 0 ? (saved / view.CompressionLogicalBytes * 100).toFixed(1) + '%' : '—';
  $('pending').textContent = bytes(view.PendingBytes);
  const known = view.LogicalBytes != null && view.PhysicalBytes != null;
  const net = known ? view.LogicalBytes - view.PhysicalBytes : null;
  $('net-label').textContent = net != null && net < 0 ? '暂多占' : '当前净节省';
  $('net-saved').textContent = bytes(net == null ? null : Math.abs(net));
  $('read').textContent = view.ReadRate == null ? '—' : bytes(view.ReadRate) + '/s';
  $('write').textContent = view.WriteRate == null ? '—' : bytes(view.WriteRate) + '/s';
  const now = Date.now();
  samples = (view.HistorySamples || []).filter(item=>Number.isFinite(item.t));
  liveIOSamples.push({t:now,r:view.ReadRate,w:view.WriteRate});liveIOSamples=liveIOSamples.filter(item=>now-item.t<=600000).slice(-600);
  text('history-note', samples.length ? '最早记录 '+new Date(samples[0].t).toLocaleString('zh-CN',{hour12:false})+'；托盘退出期间不采样。' : '历史将从首次有效观测开始保存，最多保留 30 天。');
  text('history-error', view.HistoryError || '');
  drawCharts();
  updateIncidents(view.Incidents || []);
};
command('ready');
</script>
</body>
</html>
